[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "licenser"
version = "1.0.0"
description = "Automated Open-Source License Generator (MIT, Apache, GPL, BSD) CLI"
readme = "README.md"
authors = [
  { name = "Moch. Erik Irriansyah", email = "erik@narotama.ac.id" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.scripts]
licenser = "licenser.cli:main"

[project.urls]
Homepage = "https://github.com/MochErik/licenser"
Repository = "https://github.com/MochErik/licenser.git"
